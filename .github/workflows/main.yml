name: Deploy Website to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/website
            git pull origin main || git clone https://x-access-token:${GH_TOKEN}@github.com/YOUR_USERNAME/YOUR_WEBSITE_REPO.git .
            npm install
            npm run build
            pm2 restart website || pm2 start npm --name "website" -- run start
