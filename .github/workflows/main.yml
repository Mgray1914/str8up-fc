name: Deploy Website to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/website/Str8UpCrypto
            git pull origin main
            npm install
            # Write environment variables to .env.production
            cat > .env.production <<EOL
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_IMAGE_URL=${{ secrets.NEXT_PUBLIC_IMAGE_URL }}
            NEXT_PUBLIC_TOKEN_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_TOKEN_CONTRACT_ADDRESS }}
            NEXT_PUBLIC_PREDICTION_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_PREDICTION_CONTRACT_ADDRESS }}
            NEXT_PUBLIC_BASE_RPC_URL=${{ secrets.NEXT_PUBLIC_BASE_RPC_URL }}
            NEXT_PUBLIC_GAS_FEE=${{ secrets.NEXT_PUBLIC_GAS_FEE }}
            EOL
            npm run build
            pm2 restart website || pm2 start npm --name "website" -- run start
